# Sub-Store Artifact 完整配置模板 (扁平节点全展开版)
# 适用平台: Clash / Mihomo

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ==============================================================================
# 策略组设计 (各策略分支平铺全部节点，无地区分组)
# ==============================================================================
proxy-groups:
  # 1. 核心总控分组 (包含自动选择、直连，并平铺所有单个节点)
  - name: 🚀 节点选择
    type: select
    include-all: true
    proxies:
      - ♻️ 自动选择
      - DIRECT

  # 2. 自动测速优选
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    proxies: []

  # 3. 业务策略分支 (均包含手动选择、自动选择、直连，并平铺所有单个节点)
  - name: 💬 Ai平台
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: 📝 Linux.do
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT

  - name: 📲 电报消息
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT

  # 4. 基础功能分组
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🎯 全球直连
    type: select
    include-all: true
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择

  - name: 🐟 漏网之鱼
    type: select
    include-all: true
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT

# ==============================================================================
# 规则集源绑定 (分层：个人最高优先级 + 上游自动追新)
# ==============================================================================
rule-providers:
  # --- 1. 个人专属定制 (最高优先级) ---
  my-unban:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/coderdkai/ruleset/master/Clash/Ruleset/UnBan.list"
    path: ./rules/my_unban.list

  my-proxy:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/coderdkai/ruleset/master/Clash/Ruleset/ProxyGFW.list"
    path: ./rules/my_proxy.list

  my-ai:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/coderdkai/ruleset/master/Clash/Ruleset/AI.list"
    path: ./rules/my_ai.list

  my-linuxdo:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/coderdkai/ruleset/master/Clash/Ruleset/LinuxDo.list"
    path: ./rules/my_linuxdo.list

  # --- 2. 基础与上游规则源 ---
  upstream-ad:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"
    path: ./rules/upstream_ad.list

  upstream-ai:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list"
    path: ./rules/upstream_ai.list

  upstream-telegram:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list"
    path: ./rules/upstream_telegram.list

# ==============================================================================
# 路由匹配规则 (从上至下执行)
# ==============================================================================
rules:
  # 1. 个人专属最高裁决
  - RULE-SET,my-unban,🎯 全球直连
  - RULE-SET,my-proxy,🚀 节点选择
  - RULE-SET,my-linuxdo,📝 Linux.do
  - RULE-SET,my-ai,💬 Ai平台

  # 2. 广告拦截
  - RULE-SET,upstream-ad,🛑 广告拦截

  # 3. 业务专线 (上游补充)
  - RULE-SET,upstream-ai,💬 Ai平台
  - RULE-SET,upstream-telegram,📲 电报消息

  # 4. 国内流量直连 (GEOSITE 优先判断，杜绝误伤)
  - GEOIP,LAN,🎯 全球直连,no-resolve
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,CN,🎯 全球直连

  # 5. 最终兜底 (YouTube / 谷歌等海外常规流量自然命中并走漏网之鱼/节点选择)
  - MATCH,🐟 漏网之鱼
